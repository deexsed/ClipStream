pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout redacted;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Cache only public Twitch raster assets; the cache is bounded and disposable.
    proxy_cache_path /tmp/twitch-images levels=1:2 keys_zone=twitch_images:8m max_size=128m inactive=24h use_temp_path=off;
    map $request_uri $twitch_image_uri {
        default "";
        ~^/media/twitch/(?:static-cdn\.jtvnw\.net|clips-media-assets2?\.twitch\.tv)(?<twitch_original_image_uri>/.*)$ $twitch_original_image_uri;
    }
    map $uri $twitch_image_policy {
        default "";
        ~*^/media/twitch/ "default-src 'none'; sandbox";
    }
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css;
    server {
        listen 8080;
        server_name localhost;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Image-Cache $upstream_cache_status always;
        add_header Content-Security-Policy $twitch_image_policy always;
        location = /health { access_log off; return 200 'ok'; }
        location ~* ^/media/twitch/(?<twitch_image_host>static-cdn\.jtvnw\.net|clips-media-assets2?\.twitch\.tv)/.*\.(?:jpe?g|png|webp|gif|avif)$ {
            if ($twitch_image_uri = "") { return 404; }
            limit_except GET { deny all; }
            proxy_pass https://$twitch_image_host$twitch_image_uri;
            proxy_http_version 1.1;
            # Never forward session cookies, bearer tokens or the API gateway secret.
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host $twitch_image_host;
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_hide_header Set-Cookie;
            proxy_ssl_server_name on;
            proxy_ssl_name $twitch_image_host;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
            proxy_ssl_verify_depth 3;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 5s;
            proxy_cache twitch_images;
            proxy_cache_key "$twitch_image_host$twitch_image_uri";
            proxy_cache_valid 200 24h;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        }
        location /media/twitch/ { return 404; }
        location /api/ {
            set $api http://api:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-ClipStream-Proxy-Auth "${PROXY_AUTH}";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 45s;
            proxy_send_timeout 15s;
        }
        location = /auth/callback {
            access_log off;
            error_log /dev/null crit;
            set $ui http://frontend:8080;
            proxy_pass $ui;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout http_404;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            add_header Cache-Control 'no-store';
        }
        location / {
            set $ui http://frontend:8080;
            proxy_pass $ui;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout http_404;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
        }
    }
}
