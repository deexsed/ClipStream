pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout redacted;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        location = /health { access_log off; return 200 'ok'; }
        location = /auth/callback { access_log off; error_log /dev/null crit; try_files /index.html =404; add_header Cache-Control 'no-store'; }
        location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
        location / { try_files $uri /index.html; add_header Cache-Control 'no-cache'; }
    }
}
