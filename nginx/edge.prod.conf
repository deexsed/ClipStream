pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout redacted;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json application/javascript text/css;
    server { listen 8080; server_name _; return 308 https://$host$request_uri; }
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /health { access_log off; return 200 'ok'; }
        location /api/ {
            set $api http://api:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-ClipStream-Proxy-Auth "${PROXY_AUTH}";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 45s;
            proxy_send_timeout 15s;
        }
        location = /auth/callback {
            access_log off;
            error_log /dev/null crit;
            set $ui http://frontend:8080;
            proxy_pass $ui;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout http_404;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            add_header Cache-Control 'no-store';
        }
        location / {
            set $ui http://frontend:8080;
            proxy_pass $ui;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout http_404;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
        }
    }
}

